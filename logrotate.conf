# Rotation of the security-watch event log by an external logrotate.
#
# The service rotates the log itself (sinks.file_max_mb), so this file is only
# needed where all logs are kept uniformly. Install it as
# /etc/logrotate.d/security-watch.
/var/log/security-watch/events.jsonl {
    daily
    rotate 14
    size 50M
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
    # No restart is needed: the service appends to the file by name instead of
    # holding the descriptor open between writes.
}
